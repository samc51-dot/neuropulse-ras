<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroPulse: Precision Auditory Entrainment Platform</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      color: var(--accent);
      font-size: 2.5rem;
      margin: 0 0 0.5rem 0;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin: 0;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    button {
      background-color: var(--accent);
      color: #0284c7;
      font-weight: bold;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .tap-area {
      border: 2px dashed var(--text-muted);
      border-radius: 8px;
      padding: 3rem 1rem;
      margin: 1.5rem 0;
      cursor: pointer;
      user-select: none;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .metric-card {
      background-color: rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 6px;
    }

    .metric-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <h1>NeuroPulse</h1>
    <p class="subtitle">Precision Auditory Entrainment for Neuromotor Rehabilitation</p>
  </header>

  <div class="container">
    <div class="controls">
      <button id="startBtn">Start Stimulus</button>
      <button id="stopBtn">Stop</button>
    </div>

    <div class="tap-area" id="tapArea">
      Click or press Spacebar in sync with the beat
    </div>

    <div class="metrics">
      <div class="metric-card">
        <div>Mean Timing Error</div>
        <div class="metric-value" id="maeDisplay">0 ms</div>
      </div>
      <div class="metric-card">
        <div>Total Taps</div>
        <div class="metric-value" id="tapCountDisplay">0</div>
      </div>
    </div>
  </div>

  <script>
    let audioCtx;
    let isRunning = false;
    let tapTimes = [];
    let targetTimes = [];
    let intervalId;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const tapArea = document.getElementById('tapArea');
    const maeDisplay = document.getElementById('maeDisplay');
    const tapCountDisplay = document.getElementById('tapCountDisplay');

    function playPulse(freq, duration) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    let beatCount = 0;
    function triggerBeat() {
      const now = performance.now();
      targetTimes.push(now);

      // Accent pulse every 4th beat (1200 Hz accent + 140 Hz base)
      if (beatCount % 4 === 0) {
        playPulse(140, 0.15);
        playPulse(1200, 0.03);
      } else {
        playPulse(140, 0.15);
      }
      beatCount++;
    }

    startBtn.addEventListener('click', () => {
      if (isRunning) return;
      isRunning = true;
      tapTimes = [];
      targetTimes = [];
      beatCount = 0;
      
      // 500 ms intervals (120 BPM)
      triggerBeat();
      intervalId = setInterval(triggerBeat, 500);
    });

    stopBtn.addEventListener('click', () => {
      isRunning = false;
      clearInterval(intervalId);
    });

    function registerTap() {
      if (!isRunning) return;
      const tapTime = performance.now();
      tapTimes.push(tapTime);

      // Calculate nearest target timing error
      if (targetTimes.length > 0) {
        let minDiff = Infinity;
        targetTimes.forEach(target => {
          const diff = Math.abs(tapTime - target);
          if (diff < minDiff) minDiff = diff;
        });

        tapCountDisplay.textContent = tapTimes.length;
        
        // Calculate Mean Absolute Error
        const totalError = tapTimes.reduce((acc, t) => {
          let closest = targetTimes.reduce((prev, curr) => Math.abs(curr - t) < Math.abs(prev - t) ? curr : prev);
          return acc + Math.abs(t - closest);
        }, 0);
        
        const mae = (totalError / tapTimes.length).toFixed(1);
        maeDisplay.textContent = `${mae} ms`;
      }
    }

    tapArea.addEventListener('mousedown', registerTap);
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') registerTap();
    });
  </script>
</body>
</html>
